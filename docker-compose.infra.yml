# INFRAESTRUTURA COMPARTILHADA: NGINX (proxy reverso)
# Roteia /homolog -> app-homolog:5000 e /prod -> app-prod:5000
name: financas-infra

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gcs
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gcs_net
    restart: unless-stopped

networks:
  gcs_net:
    external: true
