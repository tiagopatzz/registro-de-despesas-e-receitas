# AMBIENTE DE PRODUCAO
# App Flask + PostgreSQL proprios, com volume de dados exclusivo (vol_prod).
# Acessivel via NGINX em http://<IP-DA-VM>/prod/
name: financas-prod

services:
  db-prod:
    image: postgres:16-alpine
    container_name: db-prod
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vol_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financas"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - gcs_net

  app-prod:
    build: .
    image: financas-app:prod
    container_name: app-prod
    environment:
      APP_PREFIX: /prod
      DB_HOST: db-prod
      DB_NAME: financas
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: "5432"
      SECRET_KEY: chave_prod
      MAIL_USERNAME: ${MAIL_USERNAME:-tiago.patzlaff@universo.univates.br}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-senha}
    depends_on:
      db-prod:
        condition: service_healthy
    networks:
      - gcs_net

volumes:
  vol_prod:

networks:
  gcs_net:
    external: true
