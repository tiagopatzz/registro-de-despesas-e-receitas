# =====================================================================
# PIPELINE CI/CD - Gerencia de Configuracao de Software (Tarefa Final)
#
#   push em 'homolog' -> Integracao -> Deploy HOMOLOG
#   push em 'main'    -> Integracao -> Deploy PRODUCAO
#
# Integracao roda na nuvem do GitHub (ubuntu-latest):
#   flake8 -> 20 testes -> estatisticas de cobertura -> build.
# Deploys rodam no runner SELF-HOSTED instalado na VM da Univates.
# Se a Integracao FALHAR, os deploys NAO executam (ficam Skipped).
# =====================================================================
name: Pipeline CI/CD - GCS

on:
  push:
    branches: [homolog, main]
  workflow_dispatch:

jobs:
  integracao:
    name: "Integracao (testes + qualidade + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Analise de qualidade (flake8)
        run: flake8 app.py test_app.py migrate.py

      - name: Testes automatizados (20 testes)
        run: coverage run -m unittest -v

      - name: Estatisticas de cobertura
        run: |
          coverage report -m
          coverage xml

      - name: Publicar estatisticas (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: estatisticas-cobertura
          path: coverage.xml

      - name: Build da imagem Docker
        run: docker build -t financas-app:${{ github.sha }} .

  deploy-homolog:
    name: "Atualizar HOMOLOGACAO"
    needs: integracao
    if: github.ref == 'refs/heads/homolog'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar Homolog (NGINX + app + migrations)
        run: docker compose up -d --build nginx app-homolog db-homolog
      - name: Versao do banco em Homolog
        run: |
          sleep 5
          docker compose exec -T db-homolog psql -U postgres -d financas -c "SELECT * FROM schema_migrations ORDER BY versao;"

  deploy-prod:
    name: "Atualizar PRODUCAO"
    needs: integracao
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar Producao (NGINX + app + migrations)
        run: docker compose up -d --build nginx app-prod db-prod
      - name: Versao do banco em Producao
        run: |
          sleep 5
          docker compose exec -T db-prod psql -U postgres -d financas -c "SELECT * FROM schema_migrations ORDER BY versao;"
