# Proxy reverso dos ambientes.
# O "resolver" do Docker permite que o NGINX suba mesmo que os
# containers dos ambientes ainda nao existam (resolucao tardia de DNS).
server {
    listen 80;

    resolver 127.0.0.11 valid=10s;

    location /homolog {
        set $alvo_homolog http://app-homolog:5000;
        proxy_pass $alvo_homolog;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /prod {
        set $alvo_prod http://app-prod:5000;
        proxy_pass $alvo_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /prod/;
    }
}
